<div class="login-page">
  <div class="centered">
    <div class="container" style="width:100%">
      <div class="row">
        <div class="col-sm-3">

        </div>
        <div class="col-sm-6">
          <a (click)="gotohomePage()"><img src="../../../assets/icons/Book Box.png" height="200" width="225" class="logo"></a>
        </div>
        <div class="col-sm-3">

        </div>
      </div>
      <div class="row">
        <div class="col-sm-3">

        </div>
        <div class="col-sm-6">
          <form>
            <mat-form-field appearance="fill" class="form-width">
              <mat-label>Email</mat-label>
              <input type="email" matInput placeholder="Email" [formControl]="emailFormControl" [(ngModel)]="email">
              <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
                Please enter a valid email address
              </mat-error>
              <mat-error *ngIf="emailFormControl.hasError('required')">
                Email is <strong>required</strong>
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" class = "form-width">
              <mat-label>Password</mat-label>
              <input [type]="'password'" [formControl]="passwordFormControl" [(ngModel)]="password" matInput placeholder="Password">
              <mat-error *ngIf="passwordFormControl.hasError('required')">
                Password is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </form>
        </div>
        <div class="col-sm-3">

        </div>
      </div>
      <div class="row">
        <div class="col-sm-3">

        </div>
        <div class="col-sm-6">
          <button mat-raised-button color="primary" class="login-btn" (click)="signIn()" [disabled] = "emailFormControl.hasError('email') || emailFormControl.hasError('required') || passwordFormControl.hasError('required')" aria-label="Sign In">Sign In</button>
            <mat-error *ngIf="isError" style = "width:245px; margin-left:89px;">
              {{errorMsg}}
            </mat-error>
        </div>
        <div class="col-sm-3">

        </div>
      </div>
    </div>
    </div>
</div>
